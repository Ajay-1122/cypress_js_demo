name: Cypress Tests

on:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:


jobs:

  cypress:

    runs-on: ubuntu-latest

    steps:

      # 1. Download source code
      - name: Checkout source code
        uses: actions/checkout@v6


      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm


      # 3. Install project dependencies
      - name: Install dependencies
        run: npm ci


      # 4. Run Cypress
      - name: Run Cypress tests
        uses: cypress-io/github-action@v7
        with:
          browser: chrome


      # 5. Check what Cypress generated
      - name: Check generated files
        if: always()
        run: |
          echo "=== Project directory ==="
          ls -la

          echo "=== Cypress directory ==="
          ls -la cypress || true

          echo "=== Results directory ==="
          ls -la cypress/results || true

          echo "=== HTML directory ==="
          ls -la cypress/results/html || true

          echo "=== All HTML files ==="
          find . -type f -name "*.html" 2>/dev/null || true


      # 6. Upload HTML report
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-html-report
          path: cypress/results/html/


      # 7. Upload screenshots when tests fail
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots/


      # 8. Upload videos
      - name: Upload videos
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos/